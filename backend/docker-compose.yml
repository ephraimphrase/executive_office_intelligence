services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        image: pgvector/pgvector:pg16
        ports:
          - "5432:5432"
        environment:
          POSTGRES_DB: eois_db
          POSTGRES_USER: eois_user
          POSTGRES_PASSWORD: eois_password
        volumes:
          - postgres_data:/var/lib/postgresql/data
        networks:
          - eois-network
        healthcheck:
          test: ["CMD-SHELL", "pg_isready -U eois_user -d eois_db"]
          interval: 10s
          timeout: 5s
          retries: 5
        restart: unless-stopped

  worker:
    build: .
    command: celery -A celery_app worker --loglevel=info --concurrency=4
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eois-network
    restart: unless-stopped

  beat:
    build: .
    command: celery -A celery_app beat --loglevel=info
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eois-network
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: eois_db
      POSTGRES_USER: eois_user
      POSTGRES_PASSWORD: eois_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - eois-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eois_user -d eois_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - eois-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  flower:
    image: mher/flower:latest
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - eois-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  eois-network:
    driver: bridge
